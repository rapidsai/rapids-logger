name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - style
      - conda-cpp-build
      - dynamic-build
      - static-build
      - wheel-cpp-build
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    permissions:
      contents: read
  style:
    runs-on: ubuntu-latest
    container:
      image: rapidsai/ci-conda:latest # zizmor: ignore[unpinned-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-0|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run ci/check_style.sh
        run: ci/check_style.sh
  conda-cpp-build:
    needs: style
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    with:
      build_type: pull-request
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_conda.sh
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  wheel-cpp-build:
    needs: style
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    with:
      build_type: pull-request
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_wheel.sh
      package-name: rapids_logger
      package-type: cpp
      append-cuda-suffix: false
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  static-build:
    needs: style
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    with:
      build_type: pull-request
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_static.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  dynamic-build:
    needs: style
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@1efe7df184d1e72c1038607252fb40a9fedc8ced
    with:
      build_type: pull-request
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_dynamic.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read

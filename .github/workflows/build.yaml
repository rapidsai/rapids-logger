name: build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      date:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_type:
        type: string
        default: nightly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
  cancel-in-progress: true
permissions: {}
jobs:
  conda-cpp-build:
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@cbf3d64a73fd7b44ee70cebdb50c175b495f6b29
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_conda.sh
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  upload-conda:
    needs: conda-cpp-build
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      dual_publish: true
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  wheel-cpp-build:
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@cbf3d64a73fd7b44ee70cebdb50c175b495f6b29
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_wheel.sh
      package-name: rapids_logger
      package-type: cpp
      append-cuda-suffix: false
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  wheel-publish-cpp:
    needs: wheel-cpp-build
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: rapids_logger
      publish_to_pypi: false # PyPI publication is handled by Kitmaker.
      package-type: cpp
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  static-build:
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@cbf3d64a73fd7b44ee70cebdb50c175b495f6b29
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_static.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  dynamic-build:
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@cbf3d64a73fd7b44ee70cebdb50c175b495f6b29
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_dynamic.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read

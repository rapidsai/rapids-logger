name: build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      date:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_type:
        type: string
        default: nightly
      candidate_train_sha256:
        description: "Canonical release-train digest for a release-candidate build."
        type: string
        default: ""
      candidate_release_tag:
        description: "Final source tag created locally for a release-candidate build."
        type: string
        default: "v26.10.00"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
  cancel-in-progress: true
permissions: {}
jobs:
  conda-cpp-build:
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_conda.sh
      candidate-train-sha256: ${{ inputs.candidate_train_sha256 }}
      release-candidate-tag: ${{ inputs.candidate_release_tag }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  upload-conda:
    needs: conda-cpp-build
    secrets:
      CONDA_RAPIDSAI_NIGHTLY_TOKEN: ${{ secrets.CONDA_RAPIDSAI_NIGHTLY_TOKEN }}
      CONDA_RAPIDSAI_TOKEN: ${{ secrets.CONDA_RAPIDSAI_TOKEN }}
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      dual_publish: true
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  wheel-cpp-build:
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: group_by(.ARCH) | map(max_by([(.PY_VER|split(".")|map(tonumber)), (.CUDA_VER|split(".")|map(tonumber))]))
      script: ci/build_wheel.sh
      package-name: rapids_logger
      package-type: cpp
      append-cuda-suffix: false
      candidate-train-sha256: ${{ inputs.candidate_train_sha256 }}
      release-candidate-tag: ${{ inputs.candidate_release_tag }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  wheel-publish-cpp:
    needs: wheel-cpp-build
    secrets:
      CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN: ${{ secrets.CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN }}
      RAPIDSAI_PYPI_TOKEN: ${{ secrets.RAPIDSAI_PYPI_TOKEN }}
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: rapids_logger
      publish_to_pypi: true
      package-type: cpp
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  static-build:
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_static.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
  dynamic-build:
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@agent/shared-workflows-release-build-output-dispatch
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      container_image: "rapidsai/ci-conda:latest"
      script: "ci/build_dynamic.sh"
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
